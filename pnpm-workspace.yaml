packages:
  - apps/*
  - packages/*

overrides:
  '@hono/node-server': 2.0.10
  esbuild: 0.28.1
  # GHSA-mh99-v99m-4gvg: exponential-time expansion in brace-expansion <=5.0.7
  # (DoS). Preserve each maintenance line's CommonJS contract for minimatch.
  'brace-expansion@1.1.16': 1.1.17
  'brace-expansion@2.1.2': 2.1.3
  'brace-expansion@5.0.7': 5.0.8
  # GHSA advisory: exponential parsing time in js-yaml 5.0.0–5.2.1 flow
  # collections (DoS). @nestjs/swagger pins 5.2.1 exactly, so patch via override.
  'js-yaml@5.2.1': 5.2.2
  path-to-regexp: 8.4.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.17
  - brace-expansion@2.1.3
  - brace-expansion@5.0.8
  - js-yaml@5.2.2

auditConfig:
  # GHSA-mh99-v99m-4gvg reports vulnerable <=5.0.7 and patched >=5.0.8,
  # excluding the patched 1.x/2.x maintenance lines above. Backports alone
  # therefore cannot remove this ignore; remove it only once nothing resolves
  # to minimatch@3.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
