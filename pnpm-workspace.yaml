packages:
  - apps/*
  - packages/*

overrides:
  '@hono/node-server': 2.0.10
  esbuild: 0.28.1
  # filelist 1.0.6 pins minimatch 5 / brace-expansion 2; 2.0.2 uses minimatch 10.
  'filelist@1.0.6': 2.0.2
  # GHSA-mh99-v99m-4gvg: exponential-time expansion in brace-expansion <=5.0.7
  # (DoS). minimatch 10 accepts the patched 5.x maintenance release.
  'brace-expansion@5.0.7': 5.0.8
  # GHSA advisory: exponential parsing time in js-yaml 5.0.0–5.2.1 flow
  # collections (DoS). @nestjs/swagger pins 5.2.1 exactly, so patch via override.
  'js-yaml@5.2.1': 5.2.2
  path-to-regexp: 8.4.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
  - js-yaml@5.2.2
