# Dependabot cadence: monthly + grouped on purpose, majors deliberately split out.
#
# A group's `update-types` controls which SemVer levels it groups; if the
# key is omitted a group includes all levels (major, minor, patch) by
# default. Each ecosystem below restricts its group to `minor` and `patch`
# only, so routine, low-risk updates keep landing in a single monthly PR.
# Major updates are intentionally left OUT of the group: Dependabot then
# opens them as their own individual PRs instead of folding them into the
# grouped one. This is deliberate — a single breaking major (e.g. a schema-
# changing Prisma bump, or a compiler major like TypeScript) must never be
# able to block the eleven other routine updates behind it in the same PR.
# Majors can then be triaged and merged one at a time on their own schedule.
#
# `open-pull-requests-limit` is raised from 1 to 5 per ecosystem: 1 slot for
# the grouped minor/patch PR, plus headroom for a handful of major PRs to be
# open concurrently for triage without Dependabot silently skipping newer
# major bumps because the cap was already hit. Do not revert to
# weekly/ungrouped, and do not fold `major` back into `update-types` here,
# without re-reading this comment.
#
# Security updates are a separate Dependabot mechanism from these version
# updates and are NOT affected by interval, groups, or
# open-pull-requests-limit here — they keep flowing regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      workspace-dependencies:
        patterns: ['*']
        exclude-patterns:
          - typescript-eslint
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ['*']
        update-types:
          - minor
          - patch
