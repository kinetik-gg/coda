# Dependabot version updates are PAUSED at the maintainer's explicit instruction
# (2026-07-31): we do not want Actions minutes spent on Dependabot-triggered PRs
# right now. Dependencies are being pinned to exact versions in this same change
# so nothing drifts while updates are paused.
#
# Mechanism: `open-pull-requests-limit: 0` is GitHub's documented way to
# temporarily disable *version* updates for a package manager ("You can
# temporarily disable version updates for a package manager by setting this
# option to zero.") — see the Dependabot options reference for
# `open-pull-requests-limit`. This leaves `schedule`/`groups` in place (inert
# while the limit is 0) so the grouped, majors-split shape below can be
# restored by flipping the limit back up.
#
# Revisit condition: re-enable version updates (raise `open-pull-requests-limit`
# back to 5 for each ecosystem below) only when the maintainer explicitly asks
# for an upgrade. Until then, leave this file as-is.
#
# Institutional knowledge carried forward from the prior grouped setup, still
# true whenever this is re-enabled:
#   - Majors must never block routine minor/patch updates. Each group below
#     restricts itself to `update-types: [minor, patch]` and leaves major
#     updates OUT of the group, so a breaking major (e.g. a schema-changing
#     Prisma bump, or a compiler major like TypeScript) opens as its own PR
#     instead of blocking the other routine updates behind it in one PR.
#   - Security updates are a SEPARATE Dependabot mechanism from these version
#     updates, driven by Dependabot alerts rather than by this file. They are
#     NOT affected by `interval`, `groups`, or `open-pull-requests-limit`
#     here — they keep flowing regardless of the pause above.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      workspace-dependencies:
        patterns: ['*']
        exclude-patterns:
          - typescript-eslint
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ['*']
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      docker:
        patterns: ['*']
        update-types:
          - minor
          - patch
