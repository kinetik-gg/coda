name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path classifier. Documentation-only changes do not need the container build, the database
  # lanes, or the system-test stack, but the required-check contexts must still report. Gating
  # at the JOB level (rather than filtering the workflow trigger) is deliberate: a workflow
  # skipped by path filtering never reports its checks and blocks the pull request forever —
  # the deadlock that stalled the v0.0.6 digest propagation. A job skipped by `if:` reports a
  # `skipped` conclusion, which satisfies branch protection.
  #
  # The allowlist is deliberately conservative: anything outside it (including this workflow
  # itself) counts as code and runs the full pipeline. Failing to classify also means "code".
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER:-}" ]; then
            files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' || echo '')
          else
            files=$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename' || echo '')
          fi
          if [ -z "${files}" ]; then
            echo 'Changed paths could not be determined; running the full pipeline.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'Changed paths:'
          printf '  %s\n' ${files}
          if printf '%s\n' "${files}" \
            | grep -qvE '^docs/|^\.github/ISSUE_TEMPLATE/|(^|/)[^/]*\.md$|^LICENSE$'; then
            echo 'Code paths changed; running the full pipeline.'
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Documentation-only change; the code lanes will be skipped.'
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify workspace
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Formatting runs first and unconditionally: it is the cheapest gate, the most frequent
      # failure, and Prettier also owns the Markdown that a documentation-only change touches.
      # Everything below it is code-only work.
      - name: Formatting
        run: pnpm format:check
      - name: Validate deployment topologies
        if: needs.changes.outputs.code == 'true'
        run: pnpm deployment:validate
      - name: Validate Coolify service templates
        if: needs.changes.outputs.code == 'true'
        run: node deploy/coolify/validate-templates.cjs
      - name: Generate database client
        if: needs.changes.outputs.code == 'true'
        run: pnpm db:generate
      - name: Dependency audit
        if: needs.changes.outputs.code == 'true'
        run: pnpm audit
      - name: Quality gates
        if: needs.changes.outputs.code == 'true'
        run: pnpm quality
      - name: Type-check
        if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck
      - name: Unit tests and coverage gate
        if: needs.changes.outputs.code == 'true'
        run: pnpm test:unit
      - name: Screenplay PDF fidelity gate
        if: needs.changes.outputs.code == 'true'
        run: pnpm screenplay:pdf-fidelity
      - name: Verify generated API contract
        if: needs.changes.outputs.code == 'true'
        run: pnpm openapi:check
      - name: Verify derived SQLite schema is current
        if: needs.changes.outputs.code == 'true'
        run: pnpm sqlite:schema:check
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build

  migration-smoke:
    name: Migrate an empty database
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
        env:
          POSTGRES_DB: coda_test
          POSTGRES_USER: coda_test
          POSTGRES_PASSWORD: coda_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coda_test -d coda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://coda_test:coda_test_password@localhost:5432/coda_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:deploy

  sqlite-portability:
    name: SQLite portability lane
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # The portability tripwire (issue #77). Nothing ships on SQLite — this lane runs the API unit
    # suite plus a curated integration-adjacent subset against a throwaway SQLite database so that a
    # PR re-introducing a Postgres-only construct outside the DatabaseCapabilities seam
    # (apps/api/src/database) fails here with an actionable message. Bounded well under the budget.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @coda/fountain build && pnpm --filter @coda/contracts build
      - name: Generate database client
        run: pnpm db:generate
      - name: API unit suite (dialect-agnostic)
        run: pnpm --filter @coda/api test
      - name: Curated portability subset against SQLite
        run: pnpm test:sqlite

  system-tests:
    name: Integration and end-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: integration-postgres-password
      MINIO_ROOT_USER: integration-root
      MINIO_ROOT_PASSWORD: integration-root-password
      S3_ACCESS_KEY: integration-app
      S3_SECRET_KEY: integration-app-secret
      S3_BUCKET: coda-integration
      CODA_IMAGE: coda-test:local
      DATABASE_URL: postgresql://coda:integration-postgres-password@postgres:5432/coda?schema=public
      APP_ORIGIN: http://localhost:53000
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      S3_PUBLIC_ENDPOINT: http://localhost:59000
      MINIO_CORS_ALLOW_ORIGIN: http://localhost:53000
      SETUP_TOKEN: integration-setup-token-2026-abcdefghi
      # Tune the account lockout threshold low so the lockout+recovery scenario stays within the
      # per-IP login throttle (5/60s). Substituted into the app container by Compose and read by the
      # integration test to drive exactly this many failures.
      AUTH_LOGIN_BACKOFF_THRESHOLD: 3
      CODA_INTEGRATION_URL: http://127.0.0.1:53000
      CODA_INTEGRATION_SETUP_TOKEN: integration-setup-token-2026-abcdefghi
      CODA_INTEGRATION_EMAIL: integration@coda.local
      CODA_INTEGRATION_PASSWORD: Meridian-Backdrop-Owner-2026
      CODA_E2E_URL: http://localhost:53000
      CODA_E2E_EMAIL: integration@coda.local
      CODA_E2E_PASSWORD: Meridian-Backdrop-Owner-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build the test image once, through the shared GitHub Actions layer cache, instead of
      # letting Compose build it cold on every run. The `coda-image` scope is shared with
      # container.yml so whichever workflow builds first warms the cache for the other. The
      # Compose `up` steps below therefore run without `--build`: CODA_IMAGE already points at
      # the tag loaded here.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the test image through the shared layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: coda-test:local
          cache-from: type=gha,scope=coda-image
          cache-to: type=gha,mode=max,scope=coda-image
      - name: Start fresh full-stack production topology
        run: docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml up --detach
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:53000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml logs
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      # Release-gate budget: the serial two-context collaboration project gets at most eight
      # minutes inside this required system-test lane (three scenarios plus one CI retry).
      - name: Two-client collaboration Playwright suite
        run: timeout 8m pnpm test:e2e:collaboration
      - name: Show container logs on failure
        if: failure()
        run: docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml logs
      - name: Restart the stack on the filesystem BlobStore driver
        run: |
          docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans
          docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml -f compose.blob-fs.yaml up --detach
      - name: Wait for filesystem-driver readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:53000/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml -f compose.blob-fs.yaml logs
          exit 1
      - name: Integration tests (filesystem driver, app-proxied transfers)
        run: pnpm test:integration
      - name: Show filesystem-driver logs on failure
        if: failure()
        run: docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml -f compose.blob-fs.yaml logs
      - name: Stop disposable stack
        if: always()
        run: docker compose --project-name coda-test -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans
      - name: Smoke-test fresh app-only topology
        run: pnpm deployment:smoke app-only
      - name: Gate upgrade from v0.0.1
        run: pnpm deployment:smoke upgrade-v0.0.1
      - name: Prove concurrent-boot migration safety
        run: pnpm deployment:smoke concurrent-boot
      - name: Prove single-execution scheduler safety
        run: pnpm deployment:smoke concurrent-scheduler
